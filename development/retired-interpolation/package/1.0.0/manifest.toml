format_version = 5
id = "mmx5.enhancement.frame-interpolation"
version = "1.0.0"
name = "Mega Man X5 Native Scene Interpolation"
author = "mstan"
description = "Redraws intermediate actor and background positions while guest VBlank, logic, timers, and audio remain at stock cadence."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01334"
disc_sha256 = "be731bc4b9d3211b9267a34b8a68c769199a15479b14004ff25b67cdfebe8af4"

[[feature]]
id = "frame-interpolation"
name = "Native Scene Interpolation"
description = "Redraw actors and scrolling layers at intermediate positions. HUD and sprite animation retain their authored frames. Requires OpenGL; gameplay and audio keep their original timing."
group = "Display"
default_enabled = false

[[option]]
feature = "frame-interpolation"
id = "rate"
label = "Output rate"
description = "Follow the measured display refresh or select a fixed presentation rate."
group = "Display"
type = "choice"
default = "display"

[[option.choice]]
value = "display"
label = "Display refresh"

[[option.choice]]
value = "90"
label = "90 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option.choice]]
value = "165"
label = "165 FPS"

[[option.choice]]
value = "240"
label = "240 FPS"

[[plugin]]
feature = "frame-interpolation"
id = "mmx5.frame-interpolation"
