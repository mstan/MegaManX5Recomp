format_version = 5
id = "mmx5.coop"
version = "0.0.1"
name = "X + Zero Co-op (Alpha)"
author = "mstan"
description = "Experimental native co-op alpha with local play and opt-in independent netplay displays."
resolver = "declarative"
save_compatibility = "isolated"

[[target]]
game_id = "SLUS-01334"
disc_sha256 = "be731bc4b9d3211b9267a34b8a68c769199a15479b14004ff25b67cdfebe8af4"

[[feature]]
id = "coop"
name = "X + Zero Co-op"
description = "X and Zero play together with life meters stacked on the left. P1 uses Ride Armor. Online play can use independent displays. Requires OpenGL and a fresh boot."
group = "Experimental"
default_enabled = false

[[plugin]]
feature = "coop"
id = "mmx5.coop"

[[option]]
feature = "coop"
id = "cameras"
label = "Netplay cameras"
description = "Unified shares a camera. Split gives each online player an independent display of the shared world. The host chooses for both peers; offline play uses Unified."
type = "choice"
default = "unified"
[[option.choice]]
value = "unified"
label = "Unified"
[[option.choice]]
value = "split"
label = "Split"

[[option]]
feature = "coop"
id = "keep_zero"
label = "Keep Zero playable"
description = "Keep P2 Zero available after the story removes him. Story and ending flags stay native. Local co-op only; netplay uses native availability."
type = "boolean"
default = "false"
