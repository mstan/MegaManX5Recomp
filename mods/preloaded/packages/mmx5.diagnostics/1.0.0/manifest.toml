format_version = 15
id = "mmx5.diagnostics"
version = "1.0.0"
name = "Gameplay Diagnostics"
author = "mstan"
description = "Records accepted game inputs and starting memory cards locally. The optional input display has its own switch."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01334"
[target.disc_files]
"SLUS_013.34" = "f61827043c9a4f4100154cf0489a11a1cd1aa056284551fd8b1c24a613a6769b"
"ROCK_X5.DAT" = "5e0d1c49473ec502a7e517677ad0abdb6e9795e5dd6931ac8aa89fd4af0fa5bf"
"ROCK_X5.BIN" = "277bae60b446693aaf8e868029f4de9e256496296d0c814991c7c4aedf762552"

[[feature]]
id = "inputs"
name = "Gameplay Input Recording"
description = "Writes inputs.csv and starting card copies beneath saves/diagnostics. Enabled by default; your saved choice applies offline and online."
group = "Diagnostics"
default_enabled = true

[[plugin]]
feature = "inputs"
id = "mmx5.diagnostics"
netplay = "host_only"

[[feature]]
id = "osd"
name = "Input Display"
description = "Shows both players' buttons and the input counter. Recording works with this display off."
group = "Diagnostics"
default_enabled = false

[[plugin]]
feature = "osd"
id = "mmx5.diagnostics.osd"
netplay = "host_only"
