format_version = 5
id = "mmx5.enhancement.widescreen"
version = "1.1.0"
name = "Mega Man X5 Custom Renderer"
author = "mstan"
description = "Adaptive widescreen with authored terrain, room-edge framing, anchored HUD and expanded ordinary enemy placement."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01334"
disc_sha256 = "be731bc4b9d3211b9267a34b8a68c769199a15479b14004ff25b67cdfebe8af4"

[[feature]]
id = "widescreen"
name = "Custom Renderer"
description = "Render the wider view from the original stage map. Follows window resizing and keeps room-edge framing and HUD proportions."
group = "Display"
default_enabled = true

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect"
description = "Adaptive follows the window. Fixed choices use the same custom renderer."
group = "Display"
type = "choice"
default = "adaptive"

[[option.choice]]
value = "adaptive"
label = "Adaptive"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[option.choice]]
value = "32:9"
label = "32:9"

[[plugin]]
feature = "widescreen"
id = "mmx5.widescreen"
