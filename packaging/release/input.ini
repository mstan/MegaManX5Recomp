; PSXRecomp input mapping. PSX buttons are active when any listed source is pressed.
; Sources use SDL/Xbox names: a,b,x,y,back,start,leftshoulder,rightshoulder,
; lefttrigger[/+],righttrigger[/+],leftstick,rightstick (stick clicks -> L3/R3),
; dpup,dpdown,dpleft,dpright,leftx-/leftx+/lefty-/lefty+.
; Axis capture may append +/−; both forms are accepted. PSX slots are digital.
; Optional per-device overrides: [mapping.<sdl-guid>].

[controller]
enabled = true
device = 0
deadzone = 3277

[mapping]
up = dpup
down = dpdown
left = dpleft
right = dpright
cross = a
circle = b
square = x
triangle = y
l1 = leftshoulder
r1 = rightshoulder
l2 = lefttrigger
r2 = righttrigger
l3 = leftstick
r3 = rightstick
start = start
select = back
ls_up = lefty-
ls_down = lefty+
ls_left = leftx-
ls_right = leftx+
rs_up = righty-
rs_down = righty+
rs_left = rightx-
rs_right = rightx+
