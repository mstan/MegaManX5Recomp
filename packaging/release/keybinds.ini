# PSXRecomp Keyboard Keybinds (keyboard -> DualShock).
# Edit values and restart, or rebind live in the launcher's Controls page.
# Use SDL key names. Common: A B C ... Z, 0-9, F1-F12, Up Down Left Right,
# Return, Tab, Space, Left Shift, Right Shift, Left Ctrl, Right Ctrl,
# Backspace, Escape, Backslash. Use "None" to leave an input unbound.
# Mouse buttons also bind: Mouse1 (left), Mouse2 (middle), Mouse3 (right),
# Mouse4/Mouse5 (side); aliases LMB, MMB, RMB.
# Each input accepts an optional SECOND binding after a comma - both
# assert the input:  cross = X, Mouse1
#
# Buttons: up/down/left/right, cross/circle/square/triangle, l1/r1/l2/r2,
# l3/r3 (stick clicks), start/select. ls_* / rs_* are the left/right
# analog-stick DIRECTIONS driven from the keyboard (analog pad modes).
#
# Every player slot defaults to the same keyboard map. Rebind per slot
# for simultaneous multi-keyboard play (route a port to "Keyboard").

[player1]
up        = Up
down      = Down
left      = Left
right     = Right
cross     = X
circle    = S
square    = Z
triangle  = A
l1        = Q
r1        = W
l2        = E
r2        = R
l3        = T
r3        = Y
start     = Return
select    = Right Shift
ls_up     = Up
ls_down   = Down
ls_left   = Left
ls_right  = Right
rs_up     = None
rs_down   = None
rs_left   = None
rs_right  = None

